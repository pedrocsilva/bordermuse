name: Public photo parity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos-reference:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Fetch pinned public sources
        run: python3 scripts/qa/fetch-public-photos.py build/qa/photo-parity
      - name: Render macOS reference exports
        run: |
          swift build --package-path apps/cli -c release
          BM_CLI="$(swift build --package-path apps/cli -c release --show-bin-path)/bordermuse"
          mkdir -p build/qa/photo-parity/macos
          for BM_INPUT in build/qa/photo-parity/input/*.jpg; do
            "$BM_CLI" --input "$BM_INPUT" --output "build/qa/photo-parity/macos/$(basename "$BM_INPUT")" --border-percent 10 --aspect-ratio original
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: BorderMuse-public-photo-corpus
          path: build/qa/photo-parity/
          retention-days: 7
  windows-comparison:
    needs: macos-reference
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: BorderMuse-public-photo-corpus
          path: build/qa/photo-parity
      - run: python scripts/localization/generate.py
      - name: Compare native Windows exports with macOS
        env:
          BORDERMUSE_PHOTO_CORPUS: ${{ github.workspace }}/build/qa/photo-parity
        run: dotnet test tests/photo-parity/BorderMuse.PhotoParity.Tests.csproj -c Release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: BorderMuse-public-photo-comparison
          path: build/qa/photo-parity/
          retention-days: 7
